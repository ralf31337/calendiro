services:
  calendiro:
    image: ${CALENDIRO_IMAGE:-ghcr.io/ralf31337/calendiro}:${CALENDIRO_VERSION:-latest}
    container_name: calendiro
    restart: unless-stopped
    user: "${CALENDIRO_UID:-1000}:${CALENDIRO_GID:-1000}"
    ports:
      - "${CALENDIRO_PORT:-3000}:3000"
    volumes:
      - ./data:/data
